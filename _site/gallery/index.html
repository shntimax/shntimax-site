    <p><canvas id="shaderBackground"></canvas></p>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.min.js"></script>
  <script>
    // === INTERAKTIVER SHADER NUR IM PHOTO-TAB ===
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('shaderBackground');
      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const geometry = new THREE.PlaneGeometry(2, 2);

      const material = new THREE.ShaderMaterial({
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform vec2 iResolution;
          uniform vec2 iMouse;
          uniform float iTime;
          varying vec2 vUv;

          void main() {
            vec2 uv = vUv;
            vec2 mouse = iMouse / iResolution;

            // Reaktive Wellen von der Maus
            float dist = length(uv - mouse);
            float wave = sin(dist * 20.0 - iTime * 8.0) * 0.5 + 0.5;
            wave *= exp(-dist * 5.0); // Dämpfung

            // Farbverlauf (dein Stil: dunkel, mystisch, wie auf shntimax.space)
            vec3 colorA = vec3(0.9, 0.91, 0.95); // Tiefes Violett
            vec3 colorB = vec3(0.92, 0.90, 0.95);
            vec3 color = mix(colorA, colorB, uv.y + wave * 0.3);

            // Subtile Glüheffekte
            color += vec3(0.3, 0.1, 0.6) * wave * 0.9;

            gl_FragColor = vec4(color, 1.0);
          }
        `,
        uniforms: {
          iResolution: { value: new THREE.Vector2() },
          iMouse: { value: new THREE.Vector2() },
          iTime: { value: 0 }
        }
      });

      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      // Update Größe
      const resize = () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        material.uniforms.iResolution.value.set(window.innerWidth, window.innerHeight);
      };
      window.addEventListener('resize', resize);
      resize();

      // Mausbewegung
      document.addEventListener('mousemove', (e) => {
        material.uniforms.iMouse.value.set(e.clientX, window.innerHeight - e.clientY);
      });

      // Animation
      let startTime = Date.now();
      const animate = () => {
        material.uniforms.iTime.value = (Date.now() - startTime) * 0.001;
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      };
      animate();
    });
  </script>
  <style>

      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;

    }
